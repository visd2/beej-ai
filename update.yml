name: Update Nifty data
on:
  schedule:
    - cron: '30 11 * * 1-5'   # 5:00 pm IST, Monday to Friday, after the market closes
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_data.py
      - name: Commit if data changed
        run: |
          git config user.name "beej-bot"
          git config user.email "beej-bot@users.noreply.github.com"
          git add data/nifty-extra.json
          git diff --cached --quiet || (git commit -m "Update Nifty data" && git push)
